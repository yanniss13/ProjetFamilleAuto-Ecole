# Intégration continue : la suite complète tourne à chaque push et pull request,
# sur une base SQLite neuve. Aucun service externe : géocodage, SIRET et API
# Adresse sont désactivés par les tests eux-mêmes, et SMTP_HOST reste vide.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: file:./prisma/dev.db
      SESSION_SECRET: ci-secret-not-for-production
      SMTP_HOST: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm test
