  <g><rect class="cadre" x="40" y="2262" width="320" height="200"/><image href="png/wf-v2-30-etats-systeme.png" x="40" y="2262" width="320" height="200" preserveAspectRatio="xMidYMin slice"/><rect class="bord" x="40" y="2262" width="320" height="200"/><text class="nom" x="40" y="2482">États système</text><text class="route" x="40" y="2500">403 / 404 / 429 / 500</text></g>
