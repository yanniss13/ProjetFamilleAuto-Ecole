<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1780 2594" font-family="Segoe UI, Arial, sans-serif">
  <style>
    .titre{fill:#1a4d8f;font-size:26px;font-weight:700;}
    .legende{fill:#5b6470;font-size:13px;}
    .groupe{fill:#1a4d8f;font-size:19px;font-weight:700;}
    .nom{fill:#1f2933;font-size:13px;font-weight:600;}
    .route{fill:#5b6470;font-size:11.5px;}
    .cadre{fill:#ffffff;}
    .bord{fill:none;stroke:#3b5b8c;stroke-width:1.2;}
  </style>
  <rect width="1780" height="2594" fill="#ffffff"/>
  <text class="titre" x="40" y="42">Wireframes v2 — 30 écrans et états conformes à l'application livrée</text>
  <text class="legende" x="40" y="66">Miniatures = haut de page (recadrées) ; PNG pleine page sous png/, sources HTML navigables via index.html — 2026-07-11</text>
  <text class="groupe" x="40" y="120">Public — 13 écran(s)</text>
  <g><rect class="cadre" x="40" y="138" width="320" height="200"/><image href="png/wf-v2-01-accueil.png" x="40" y="138" width="320" height="200" preserveAspectRatio="xMidYMin slice"/><rect class="bord" x="40" y="138" width="320" height="200"/><text class="nom" x="40" y="358">Accueil</text><text class="route" x="40" y="376">GET /</text></g>
  <g><rect class="cadre" x="380" y="138" width="320" height="200"/><image href="png/wf-v2-02-annonces.png" x="380" y="138" width="320" height="200" preserveAspectRatio="xMidYMin slice"/><rect class="bord" x="380" y="138" width="320" height="200"/><text class="nom" x="380" y="358">Liste des annonces</text><text class="route" x="380" y="376">GET /annonces</text></g>
  <g><rect class="cadre" x="720" y="138" width="320" height="200"/><image href="png/wf-v2-03-carte.png" x="720" y="138" width="320" height="200" preserveAspectRatio="xMidYMin slice"/><rect class="bord" x="720" y="138" width="320" height="200"/><text class="nom" x="720" y="358">Carte des annonces</text><text class="route" x="720" y="376">GET /annonces?vue=carte</text></g>
  <g><rect class="cadre" x="1060" y="138" width="320" height="200"/><image href="png/wf-v2-04-annonce-detail.png" x="1060" y="138" width="320" height="200" preserveAspectRatio="xMidYMin slice"/><rect class="bord" x="1060" y="138" width="320" height="200"/><text class="nom" x="1060" y="358">Détail et candidature</text><text class="route" x="1060" y="376">GET /annonces/:id</text></g>
  <g><rect class="cadre" x="1400" y="138" width="320" height="200"/><image href="png/wf-v2-05-alertes.png" x="1400" y="138" width="320" height="200" preserveAspectRatio="xMidYMin slice"/><rect class="bord" x="1400" y="138" width="320" height="200"/><text class="nom" x="1400" y="358">Créer une alerte</text><text class="route" x="1400" y="376">GET /alertes</text></g>
  <g><rect class="cadre" x="40" y="406" width="320" height="200"/><image href="png/wf-v2-06-alerte-confirmee.png" x="40" y="406" width="320" height="200" preserveAspectRatio="xMidYMin slice"/><rect class="bord" x="40" y="406" width="320" height="200"/><text class="nom" x="40" y="626">Alerte activée</text><text class="route" x="40" y="644">GET /alertes/confirmer/:token</text></g>
  <g><rect class="cadre" x="380" y="406" width="320" height="200"/><image href="png/wf-v2-07-alerte-desabonnement.png" x="380" y="406" width="320" height="200" preserveAspectRatio="xMidYMin slice"/><rect class="bord" x="380" y="406" width="320" height="200"/><text class="nom" x="380" y="626">Se désabonner</text><text class="route" x="380" y="644">GET /alertes/desabonner/:token</text></g>
