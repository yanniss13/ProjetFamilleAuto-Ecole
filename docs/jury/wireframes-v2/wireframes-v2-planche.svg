  <g><rect class="cadre" x="1060" y="406" width="320" height="200"/><image href="png/wf-v2-09-connexion.png" x="1060" y="406" width="320" height="200" preserveAspectRatio="xMidYMin slice"/><rect class="bord" x="1060" y="406" width="320" height="200"/><text class="nom" x="1060" y="626">Connexion auto-école</text><text class="route" x="1060" y="644">GET /connexion</text></g>
  <g><rect class="cadre" x="1400" y="406" width="320" height="200"/><image href="png/wf-v2-10-inscription.png" x="1400" y="406" width="320" height="200" preserveAspectRatio="xMidYMin slice"/><rect class="bord" x="1400" y="406" width="320" height="200"/><text class="nom" x="1400" y="626">Inscription auto-école</text><text class="route" x="1400" y="644">GET /inscription</text></g>
  <g><rect class="cadre" x="40" y="674" width="320" height="200"/><image href="png/wf-v2-11-email-verifie.png" x="40" y="674" width="320" height="200" preserveAspectRatio="xMidYMin slice"/><rect class="bord" x="40" y="674" width="320" height="200"/><text class="nom" x="40" y="894">Email vérifié</text><text class="route" x="40" y="912">GET /verifier-email/:token</text></g>
  <g><rect class="cadre" x="380" y="674" width="320" height="200"/><image href="png/wf-v2-12-mot-de-passe-oublie.png" x="380" y="674" width="320" height="200" preserveAspectRatio="xMidYMin slice"/><rect class="bord" x="380" y="674" width="320" height="200"/><text class="nom" x="380" y="894">Mot de passe oublié</text><text class="route" x="380" y="912">GET /mot-de-passe-oublie</text></g>
  <g><rect class="cadre" x="720" y="674" width="320" height="200"/><image href="png/wf-v2-13-reinitialisation.png" x="720" y="674" width="320" height="200" preserveAspectRatio="xMidYMin slice"/><rect class="bord" x="720" y="674" width="320" height="200"/><text class="nom" x="720" y="894">Nouveau mot de passe</text><text class="route" x="720" y="912">GET /reinitialiser/:token</text></g>
  <text class="groupe" x="40" y="986">Candidat — 5 écran(s)</text>
  <g><rect class="cadre" x="40" y="1004" width="320" height="200"/><image href="png/wf-v2-14-suivi-attente.png" x="40" y="1004" width="320" height="200" preserveAspectRatio="xMidYMin slice"/><rect class="bord" x="40" y="1004" width="320" height="200"/><text class="nom" x="40" y="1224">Suivi — en attente</text><text class="route" x="40" y="1242">GET /suivi/:token</text></g>
  <g><rect class="cadre" x="380" y="1004" width="320" height="200"/><image href="png/wf-v2-15-suivi-refuse.png" x="380" y="1004" width="320" height="200" preserveAspectRatio="xMidYMin slice"/><rect class="bord" x="380" y="1004" width="320" height="200"/><text class="nom" x="380" y="1224">Suivi — refusée</text><text class="route" x="380" y="1242">GET /suivi/:token</text></g>
  <g><rect class="cadre" x="720" y="1004" width="320" height="200"/><image href="png/wf-v2-16-suivi-accepte.png" x="720" y="1004" width="320" height="200" preserveAspectRatio="xMidYMin slice"/><rect class="bord" x="720" y="1004" width="320" height="200"/><text class="nom" x="720" y="1224">Suivi — acceptée</text><text class="route" x="720" y="1242">GET /suivi/:token</text></g>
  <g><rect class="cadre" x="1060" y="1004" width="320" height="200"/><image href="png/wf-v2-17-signature-candidat.png" x="1060" y="1004" width="320" height="200" preserveAspectRatio="xMidYMin slice"/><rect class="bord" x="1060" y="1004" width="320" height="200"/><text class="nom" x="1060" y="1224">Signature du candidat</text><text class="route" x="1060" y="1242">GET /suivi/:token/signer</text></g>
  <g><rect class="cadre" x="1400" y="1004" width="320" height="200"/><image href="png/wf-v2-18-suivi-signe.png" x="1400" y="1004" width="320" height="200" preserveAspectRatio="xMidYMin slice"/><rect class="bord" x="1400" y="1004" width="320" height="200"/><text class="nom" x="1400" y="1224">Suivi — contrat signé</text><text class="route" x="1400" y="1242">GET /suivi/:token</text></g>
  <text class="groupe" x="40" y="1316">Auto-école — 7 écran(s)</text>
  <g><rect class="cadre" x="40" y="1334" width="320" height="200"/><image href="png/wf-v2-19-dashboard-ecole.png" x="40" y="1334" width="320" height="200" preserveAspectRatio="xMidYMin slice"/><rect class="bord" x="40" y="1334" width="320" height="200"/><text class="nom" x="40" y="1554">Tableau de bord école</text><text class="route" x="40" y="1572">GET /tableau-de-bord</text></g>
  <g><rect class="cadre" x="380" y="1334" width="320" height="200"/><image href="png/wf-v2-20-mes-annonces.png" x="380" y="1334" width="320" height="200" preserveAspectRatio="xMidYMin slice"/><rect class="bord" x="380" y="1334" width="320" height="200"/><text class="nom" x="380" y="1554">Mes annonces</text><text class="route" x="380" y="1572">GET /mes-annonces</text></g>
  <g><rect class="cadre" x="720" y="1334" width="320" height="200"/><image href="png/wf-v2-21-annonce-creation.png" x="720" y="1334" width="320" height="200" preserveAspectRatio="xMidYMin slice"/><rect class="bord" x="720" y="1334" width="320" height="200"/><text class="nom" x="720" y="1554">Nouvelle annonce</text><text class="route" x="720" y="1572">GET /mes-annonces/nouvelle</text></g>
  <g><rect class="cadre" x="1060" y="1334" width="320" height="200"/><image href="png/wf-v2-22-annonce-modification.png" x="1060" y="1334" width="320" height="200" preserveAspectRatio="xMidYMin slice"/><rect class="bord" x="1060" y="1334" width="320" height="200"/><text class="nom" x="1060" y="1554">Modifier une annonce</text><text class="route" x="1060" y="1572">GET /mes-annonces/:id/modifier</text></g>
  <g><rect class="cadre" x="1400" y="1334" width="320" height="200"/><image href="png/wf-v2-23-candidatures.png" x="1400" y="1334" width="320" height="200" preserveAspectRatio="xMidYMin slice"/><rect class="bord" x="1400" y="1334" width="320" height="200"/><text class="nom" x="1400" y="1554">Candidatures reçues</text><text class="route" x="1400" y="1572">GET /mes-annonces/:id/candidatures</text></g>
  <g><rect class="cadre" x="40" y="1602" width="320" height="200"/><image href="png/wf-v2-24-contrat-ecole.png" x="40" y="1602" width="320" height="200" preserveAspectRatio="xMidYMin slice"/><rect class="bord" x="40" y="1602" width="320" height="200"/><text class="nom" x="40" y="1822">Établir le contrat</text><text class="route" x="40" y="1840">GET /mes-annonces/:id/candidatures/:appId/accepter</text></g>
  <g><rect class="cadre" x="380" y="1602" width="320" height="200"/><image href="png/wf-v2-25-mon-compte.png" x="380" y="1602" width="320" height="200" preserveAspectRatio="xMidYMin slice"/><rect class="bord" x="380" y="1602" width="320" height="200"/><text class="nom" x="380" y="1822">Mon compte</text><text class="route" x="380" y="1840">GET /mon-compte</text></g>
  <text class="groupe" x="40" y="1914">Administration — 4 écran(s)</text>
  <g><rect class="cadre" x="40" y="1932" width="320" height="200"/><image href="png/wf-v2-26-connexion-admin.png" x="40" y="1932" width="320" height="200" preserveAspectRatio="xMidYMin slice"/><rect class="bord" x="40" y="1932" width="320" height="200"/><text class="nom" x="40" y="2152">Connexion admin</text><text class="route" x="40" y="2170">GET /admin/connexion</text></g>
  <g><rect class="cadre" x="380" y="1932" width="320" height="200"/><image href="png/wf-v2-27-dashboard-admin.png" x="380" y="1932" width="320" height="200" preserveAspectRatio="xMidYMin slice"/><rect class="bord" x="380" y="1932" width="320" height="200"/><text class="nom" x="380" y="2152">Dashboard administration</text><text class="route" x="380" y="2170">GET /admin</text></g>
  <g><rect class="cadre" x="720" y="1932" width="320" height="200"/><image href="png/wf-v2-28-admin-ecoles.png" x="720" y="1932" width="320" height="200" preserveAspectRatio="xMidYMin slice"/><rect class="bord" x="720" y="1932" width="320" height="200"/><text class="nom" x="720" y="2152">Modération des écoles</text><text class="route" x="720" y="2170">GET /admin/ecoles</text></g>
  <g><rect class="cadre" x="1060" y="1932" width="320" height="200"/><image href="png/wf-v2-29-admin-annonces.png" x="1060" y="1932" width="320" height="200" preserveAspectRatio="xMidYMin slice"/><rect class="bord" x="1060" y="1932" width="320" height="200"/><text class="nom" x="1060" y="2152">Modération des annonces</text><text class="route" x="1060" y="2170">GET /admin/annonces</text></g>
